apiVersion: apps/v1
kind: Deployment
metadata:
  name: apache-waf
  namespace: grupoa3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apache-waf
  template:
    metadata:
      annotations:
        co.elastic.logs/enabled: "true"
        co.elastic.logs.paths: /var/log/apache2/*.log        

        co.elastic.logs/module: apache
        co.elastic.logs.fileset.access.enabled: "true"
        co.elastic.logs.fileset.error.enabled: "true"
        co.elastic.logs/processors.add_fields.fields.service: apache-waf
        co.elastic.logs/processors.add_fields.fields.env: grupoa3
      labels:
        app: apache-waf
        env: grupoa3
    spec:
      containers:
        - name: apache
          image: danigarcia04/apache-app:1.2
          ports:
            - containerPort: 80
