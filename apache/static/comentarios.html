<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Comentarios - Academia de Idiomas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#485fc7',
                        primaryLight: '#748ffc'
                    }
                }
            }
        }
    </script>
    <script>
        var myHeaders = new Headers();
        myHeaders.append("Content-Type", "application/json");
        
        function showLoading() {
            document.getElementById('loading').classList.remove('hidden');
        }
        
        function hideLoading() {
            document.getElementById('loading').classList.add('hidden');
        }
        
        onload=function(){
            pedirComentarios();
        }
        
        function guardarComentario() {
            const usuario = document.getElementById("usuario").value;
            const descripcion = document.getElementById("descripcion").value;
            
            if (!usuario || !descripcion) {
                alert("Por favor, completa todos los campos");
                return;
            }
            
            showLoading();
            
            var raw = JSON.stringify({
                "usuario": usuario,
                "descripcion": descripcion
            });

            var requestOptions = {
                method: 'POST',
                headers: myHeaders,
                body: raw
            };

            fetch("/api/comentarios/", requestOptions)
                .then(response => response.json())
                .then(result => {
                    hideLoading();
                    if (result.status == "OK"){
                        alert("Comentario almacenado correctamente");
                        document.getElementById("descripcion").value = "";
                        pedirComentarios();
                    } else {
                        alert("El comentario no ha podido almacenarse");
                    }
                })
                .catch(error => {
                    hideLoading();
                    console.log('error', error);
                });
        }
        
        function pintarComentarios(lista){
            const container = document.getElementById('comentariosContainer');
            container.innerHTML = "";
            
            if (!lista || lista.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 text-gray-400">
                        <i class="fas fa-comments text-5xl mb-4"></i>
                        <p class="text-lg">No hay comentarios aún</p>
                        <p class="text-sm">Sé el primero en dejar tu opinión</p>
                    </div>
                `;
                return;
            }
            
            lista.forEach((comentario, index) => {
                const div = document.createElement('div');
                div.className = 'bg-white rounded-lg p-4 mb-4 shadow-md border-l-4 border-primary animate-fade-in';
                div.style.animationDelay = `${index * 0.1}s`;
                div.innerHTML = `
                    <div class="font-bold text-primary mb-2 flex items-center gap-2">
                        <i class="fas fa-user-circle"></i> ${comentario.usuario}
                    </div>
                    <div class="text-gray-600 leading-relaxed">
                        <i class="fas fa-quote-left text-primary mr-2"></i>
                        ${comentario.descripcion}
                    </div>
                `;
                container.appendChild(div);
            });
        }
        
        function pedirComentarios(){
            showLoading();
            var requestOptions = {
                method: 'GET',
                headers: myHeaders,
            };

            fetch("/api/comentarios/", requestOptions)
                .then(response => response.json())
                .then(result => {
                    hideLoading();
                    if (Array.isArray(result)){
                        pintarComentarios(result);
                    }
                })
                .catch(error => {
                    hideLoading();
                    console.log('error', error);
                    alert("Ha habido un error al recuperar los comentarios");
                });
        }
    </script>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.5s ease forwards;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-100 to-gray-200 min-h-screen font-sans">
    <div id="loading" class="fixed inset-0 bg-white/90 flex items-center justify-center z-50 hidden">
        <div class="text-center">
            <button class="button is-loading is-large is-primary text-4xl bg-primary text-white px-8 py-4 rounded-lg">Cargando</button>
        </div>
    </div>

    <section class="bg-gradient-to-r from-primary to-purple-600 text-white py-12 px-8 rounded-b-3xl mb-8">
        <div class="container mx-auto text-center">
            <h1 class="text-3xl font-bold">
                <i class="fas fa-comments"></i> Comentarios
            </h1>
            <p class="text-lg opacity-90 mt-2">Opiniones de nuestros estudiantes</p>
        </div>
    </section>

    <section class="container mx-auto px-4 mb-12">
        <a href="index.html" class="inline-flex items-center gap-2 text-primary hover:text-primaryDark font-semibold transition-colors mb-8">
            <i class="fas fa-arrow-left"></i> Volver al inicio
        </a>
        
        <div class="grid md:grid-cols-3 gap-6">
            <div class="md:col-span-2">
                <div class="bg-white rounded-xl shadow-lg overflow-hidden">
                    <div class="bg-primary text-white px-6 py-4">
                        <h2 class="font-bold text-lg">
                            <i class="fas fa-list mr-2"></i> Comentarios Recientes
                        </h2>
                    </div>
                    <div class="p-6" id="comentariosContainer">
                    </div>
                </div>
            </div>
            
            <div class="md:col-span-1">
                <div class="bg-white rounded-xl shadow-lg p-6">
                    <h2 class="text-xl font-bold text-gray-800 mb-4">
                        <i class="fas fa-pen mr-2 text-primary"></i> Nuevo Comentario
                    </h2>
                    
                    <div class="mb-4">
                        <label class="block font-semibold text-gray-700 mb-2" for="usuario">
                            <i class="fas fa-user mr-2"></i> Usuario
                        </label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class="fas fa-user-circle text-gray-400"></i>
                            </div>
                            <input required type="text" class="w-full pl-10 pr-4 py-3 border-2 border-gray-200 rounded-lg focus:border-primary focus:ring-4 focus:ring-primary/10 outline-none transition-all" placeholder="Tu nombre" name="usuario" id="usuario">
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label class="block font-semibold text-gray-700 mb-2" for="descripcion">
                            <i class="fas fa-comment mr-2"></i> Comentario
                        </label>
                        <textarea required class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:border-primary focus:ring-4 focus:ring-primary/10 outline-none transition-all resize-none" placeholder="Escribe tu comentario..." name="descripcion" id="descripcion" rows="4"></textarea>
                    </div>
                    
                    <button type="button" onclick="guardarComentario()" class="w-full bg-primary hover:bg-primaryDark text-white font-bold py-3 px-4 rounded-lg transition-all transform hover:scale-105 shadow-lg">
                        <i class="fas fa-paper-plane"></i> Enviar Comentario
                    </button>
                </div>
            </div>
        </div>
    </section>   
</body>
</html>
