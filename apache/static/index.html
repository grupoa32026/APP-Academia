<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>APP Academia de Idiomas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#485fc7',
                        primaryDark: '#3a51b3',
                        secondary: '#f5f7fa'
                    }
                }
            }
        }
    </script>
    <style>
        .error-message {
            display: none;
            animation: shake 0.5s ease;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
    </style>
    <script>
        var myHeaders = new Headers();
        myHeaders.append("Content-Type", "application/json");
        if (sessionStorage.getItem("csrf_token")){
            myHeaders.append("X-CSRFToken",sessionStorage.getItem("csrf_token"))
        }

        function verComentarios() {
            location.href="comentarios.html";
        }

        function conectar() {
            document.querySelector(".error-message").style.display = "none";
            const btn = document.querySelector(".btn-primary");
            btn.classList.add("opacity-50", "cursor-not-allowed");

            var raw = JSON.stringify({
                "username": document.getElementById("username").value,
                "password": document.getElementById("password").value
            });

            var requestOptions = {
                method: 'POST',
                headers: myHeaders,
                body: raw
            };

            fetch("/api/usuarios/login", requestOptions)
                .then(response => response.json())
                .then(result => {
                    btn.classList.remove("opacity-50", "cursor-not-allowed");
                    if (result.status == "OK") {
                        sessionStorage.setItem("csrf_token", result.csrf_token);
                        sessionStorage.setItem("perfil", result.perfil);
                        localStorage.setItem("username", document.getElementById("username").value);
                        location.href = "clases.html";
                    } else {
                        document.querySelector(".error-message").style.display = "block";
                    }
                })
                .catch(error => {
                    btn.classList.remove("opacity-50", "cursor-not-allowed");
                    console.log('error', error);
                });
        }

        document.addEventListener('keypress', function(e) {
            if(e.key === 'Enter') {
                conectar();
            }
        });
    </script>
</head>

<body class="bg-gradient-to-br from-gray-100 to-gray-200 min-h-screen font-sans">
    <section class="bg-gradient-to-r from-primary to-purple-600 text-white py-16 px-8 rounded-b-3xl mb-12 shadow-lg">
        <div class="container mx-auto text-center">
            <h1 class="text-4xl font-bold mb-2">
                <i class="fas fa-language"></i> Academia de Idiomas 2.0
            </h1>
            <p class="text-xl opacity-90">Aprende idiomas de manera efectiva</p>
        </div>
    </section>

    <section class="container mx-auto px-4">
        <div class="max-w-md mx-auto bg-white rounded-xl shadow-xl p-8 mb-12 transition-transform hover:-translate-y-1">
            <h2 class="text-2xl font-bold text-primary text-center mb-6">
                <i class="fas fa-user-circle"></i> Iniciar Sesión
            </h2>
            
            <div class="error-message bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">
                <i class="fas fa-exclamation-triangle"></i> Usuario o contraseña incorrectos
            </div>
            
            <div class="mb-5">
                <label for="username" class="block font-semibold text-gray-700 mb-2">
                    <i class="fas fa-user"></i> Usuario
                </label>
                <input type="text" name="username" id="username" class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:border-primary focus:ring-4 focus:ring-primary/10 outline-none transition-all" placeholder="Ingresa tu usuario" autocomplete="username">
            </div>
            
            <div class="mb-6">
                <label for="password" class="block font-semibold text-gray-700 mb-2">
                    <i class="fas fa-lock"></i> Contraseña
                </label>
                <input type="password" name="password" id="password" class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:border-primary focus:ring-4 focus:ring-primary/10 outline-none transition-all" placeholder="Ingresa tu contraseña" autocomplete="current-password">
            </div>
            
            <div class="mb-4">
                <button type="button" onclick="conectar()" class="btn-primary w-full bg-primary hover:bg-primaryDark text-white font-bold py-3 px-6 rounded-lg transition-all transform hover:scale-105 shadow-lg">
                    <i class="fas fa-sign-in-alt"></i> Ingresar
                </button>
            </div>
            
            <div class="text-center">
                <a href="registro.html" class="inline-block border-2 border-primary text-primary hover:bg-primary hover:text-white font-bold py-3 px-6 rounded-lg transition-all">
                    <i class="fas fa-user-plus"></i> Registrarse
                </a>
            </div>
        </div>
        
        <div class="bg-white rounded-xl shadow-lg p-8 text-center">
            <i class="fas fa-comments text-5xl text-primary mb-4"></i>
            <h3 class="text-xl font-bold text-gray-800 mb-2">¿Qué opinan nuestros estudiantes?</h3>
            <p class="text-gray-600 mb-4">Mira los comentarios de otros estudiantes</p>
            <button type="button" onclick="verComentarios()" class="bg-primary hover:bg-primaryDark text-white font-bold py-3 px-6 rounded-lg transition-all transform hover:scale-105 shadow-lg">
                <i class="fas fa-eye"></i> Ver Comentarios
            </button>
        </div>
    </section>
</body>
</html>
