services:
  mariadba3:
    image: mariadb
    container_name: mariadba3
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_USER_PASSWORD: ${MARIADB_USER_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
    volumes:
      - mariadb_dataa3:/var/lib/mysql
      - ./Clases.sql://docker-entrypoint-initdb.d/Clases.sql:ro
    user: mysql
  phpmyadmina3:
    image: phpmyadmin
    container_name: phpmyadmina3
    restart: unless-stopped
    environment:
      - PMA_HOST=${PMA_HOST}
    ports:
      - 7003:80
    depends_on:
      - mariadba3

  pythona3:
    build: ./api
    container_name: pythona3
    environment:
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      PORT: ${PORT}
      HOST: ${HOST}
    depends_on:
      - mariadba3
    restart: unless-stopped

  apachea3:
    build: ./apache
    ports:
      - 6003:80
    depends_on:
      - pythona3
    links:
      - pythona3
    restart: unless-stopped
volumes:
  mariadb_dataa3:
