apiVersion: v1
kind: PersistentVolume
metadata:
  name: grupoa3-pv
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /mnt/data/mysql-grupoa3

---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grupoa3-pvc
  namespace: grupoa3
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: manual
  resources:
    requests:
      storage: 1Gi
