apiVersion: apps/v1
kind: Deployment
metadata:
  name: apache-waf
  namespace: grupoa3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apache-waf
  template:
    metadata:
      labels:
        app: apache-waf
    spec:
      containers:
        - name: apache
          image: danigarcia04/apache-app:1
          ports:
            - containerPort: 80
