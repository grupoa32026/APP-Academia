<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clases - Academia de Idiomas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#485fc7',
                        primaryLight: '#748ffc',
                        success: '#48c774',
                        danger: '#f14668',
                        warning: '#ffdd57'
                    }
                }
            }
        }
    </script>
    <script>
        var myHeaders = new Headers();
        myHeaders.append("Content-Type", "application/json");
        
        function showLoading() {
            document.getElementById('loading').classList.remove('hidden');
        }
        
        function hideLoading() {
            document.getElementById('loading').classList.add('hidden');
        }
        
        onload=function(){
            const username = localStorage.getItem('username') || 'Usuario';
            document.getElementById('usernameText').textContent = username;
            pedirClases();
        }
        
        function pintarClases(lista){
            let tbody=document.getElementById('tablaClases');
            tbody.innerHTML="";
            
            if (!lista || lista.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="7" class="text-center py-8">
                            <div class="text-gray-400">
                                <i class="fas fa-book text-5xl mb-2"></i>
                                <p class="text-lg">No hay clases disponibles</p>
                                <p class="text-sm">Agrega una nueva clase para comenzar</p>
                            </div>
                        </td>
                    </tr>
                `;
                return;
            }
            
            lista.forEach(clase => {
                let fotoUrl = clase.foto || 'https://via.placeholder.com/80x60';
                let row = document.createElement('tr');
                row.className = "hover:bg-primary/5 transition-colors";
                row.innerHTML = `
                    <td class="py-4 px-4">
                        <img src="${fotoUrl}" class="w-20 h-15 object-cover rounded-lg shadow-md hover:scale-110 transition-transform" alt="${clase.idioma}" onerror="this.src='https://via.placeholder.com/80x60'">
                    </td>
                    <td class="py-4 px-4"><strong class="text-gray-800">${clase.idioma}</strong></td>
                    <td class="py-4 px-4"><span class="bg-primaryLight/10 text-primary px-3 py-1 rounded-full text-sm font-medium">${clase.nivel}</span></td>
                    <td class="py-4 px-4 font-bold">€${parseFloat(clase.precio).toFixed(2)}</td>
                    <td class="py-4 px-4 font-bold text-primary">€${(parseFloat(clase.precio) + parseFloat(clase.iva)).toFixed(2)}</td>
                    <td class="py-4 px-4">
                        <a href="editar_clase.html?id=${clase.id}" class="inline-flex items-center gap-1 bg-primaryLight hover:bg-primary text-white px-3 py-2 rounded-lg text-sm font-medium transition-all hover:-translate-y-0.5">
                            <i class="fas fa-edit"></i> Editar
                        </a>
                    </td>
                    <td class="py-4 px-4">
                        <button onclick="eliminarClase(${clase.id})" class="inline-flex items-center gap-1 bg-danger hover:bg-red-600 text-white px-3 py-2 rounded-lg text-sm font-medium transition-all hover:-translate-y-0.5">
                            <i class="fas fa-trash"></i> Eliminar
                        </button>
                    </td>
                `;
                tbody.appendChild(row);                            
            });
        }
        
        function pedirClases(){
            showLoading();
            var requestOptions = {
                method: 'GET',
                headers: myHeaders,
            };

            fetch("/api/clases/", requestOptions)
                .then(response => response.json())
                .then(result => {
                    hideLoading();
                    console.log(result);
                    pintarClases(result);
                })
                .catch(error => {
                    hideLoading();
                    console.log('error', error);
                    alert("Ha habido un error al recuperar las clases. Refresque la página");
                });
        }
        
        function eliminarClase(id){
            if (confirm('¿Estás seguro de que deseas eliminar esta clase?')) {
                showLoading();
                var requestOptions = {
                    method: 'DELETE',
                    headers: myHeaders,
                };

                fetch("/api/clases/"+id, requestOptions)
                    .then(response => response.json())
                    .then(result => {
                        hideLoading();
                        if (result.status == "OK"){
                            alert("Clase eliminada correctamente");
                            pedirClases();
                        } else {
                            alert("La clase no ha podido ser eliminada");
                        }
                    })
                    .catch(error => {
                        hideLoading();
                        console.log('error', error);
                        alert("Se ha producido un error y la clase no ha podido ser eliminada");
                    });
            }
        }
        
        function cerrarSesion(){
            localStorage.removeItem("username");
            location.href="index.html";
        }
    </script>
</head>
<body class="bg-gray-100 min-h-screen font-sans">
    <div id="loading" class="fixed inset-0 bg-white/90 flex items-center justify-center z-50 hidden">
        <div class="text-center">
            <button class="button is-loading is-large is-primary text-4xl bg-primary text-white px-8 py-4 rounded-lg">Cargando</button>
        </div>
    </div>

    <nav class="bg-gradient-to-r from-primary to-purple-600 shadow-lg">
        <div class="container mx-auto px-4">
            <div class="flex justify-between items-center py-4">
                <a class="text-white font-bold text-lg" href="#">
                    <i class="fas fa-language"></i>&nbsp;Academia de Idiomas
                </a>
                <div class="hidden md:flex items-center space-x-4">
                    <a class="text-white/90 hover:bg-white/10 px-3 py-2 rounded-lg transition-colors" href="clases.html">
                        <i class="fas fa-book"></i>&nbsp;Clases
                    </a>
                    <a class="text-white/90 hover:bg-white/10 px-3 py-2 rounded-lg transition-colors" href="ficheros.html">
                        <i class="fas fa-folder"></i>&nbsp;Archivos
                    </a>
                    <span class="bg-white/10 text-white px-3 py-1 rounded-full text-sm">
                        <i class="fas fa-user"></i>&nbsp;<span id="usernameText">Usuario</span>
                    </span>
                    <button onclick="cerrarSesion()" class="bg-white/10 hover:bg-white/20 text-white px-3 py-2 rounded-lg transition-colors">
                        <i class="fas fa-sign-out-alt"></i>&nbsp;Cerrar sesión
                    </button>
                </div>
            </div>
        </div>
    </nav>
    
    <div class="bg-gradient-to-r from-primary to-purple-600 text-white py-12 px-8 rounded-b-3xl mb-8 shadow-lg">
        <div class="container mx-auto text-center">
            <h1 class="text-3xl font-bold">
                <i class="fas fa-graduation-cap"></i> Catálogo de Clases
            </h1>
            <p class="text-lg opacity-90 mt-2">Explora nuestros cursos de idiomas</p>
        </div>
    </div>

    <section class="container mx-auto px-4 mb-12">
        <div class="flex flex-col md:flex-row justify-between items-center mb-6">
            <h2 class="text-2xl font-bold text-gray-800 mb-4 md:mb-0">
                <i class="fas fa-list text-primary mr-2"></i> Clases Disponibles
            </h2>
            <a id="enlaceAgregar" href="agregar_clase.html" class="inline-flex items-center gap-2 bg-success hover:bg-green-600 text-white px-4 py-3 rounded-lg font-bold transition-all hover:-translate-y-0.5 shadow-lg">
                <i class="fas fa-plus"></i> Agregar Clase
            </a>
        </div>
        
        <div class="bg-white rounded-xl shadow-lg overflow-hidden">
            <table class="w-full">
                <thead class="bg-primary text-white">
                    <tr>
                        <th class="py-4 px-4 text-left font-semibold uppercase text-sm tracking-wider"><i class="fas fa-image mr-2"></i>Foto</th>
                        <th class="py-4 px-4 text-left font-semibold uppercase text-sm tracking-wider"><i class="fas fa-language mr-2"></i>Idioma</th>
                        <th class="py-4 px-4 text-left font-semibold uppercase text-sm tracking-wider"><i class="fas fa-signal mr-2"></i>Nivel</th>
                        <th class="py-4 px-4 text-left font-semibold uppercase text-sm tracking-wider"><i class="fas fa-tag mr-2"></i>Precio</th>
                        <th class="py-4 px-4 text-left font-semibold uppercase text-sm tracking-wider"><i class="fas fa-money-bill-wave mr-2"></i>Precio + IVA</th>
                        <th class="py-4 px-4 text-left font-semibold uppercase text-sm tracking-wider"><i class="fas fa-edit mr-2"></i>Editar</th>
                        <th class="py-4 px-4 text-left font-semibold uppercase text-sm tracking-wider"><i class="fas fa-trash mr-2"></i>Eliminar</th>
                    </tr>
                </thead>
                <tbody id="tablaClases">
                </tbody>
            </table>
        </div>
    </section>    
</body>
</html>
