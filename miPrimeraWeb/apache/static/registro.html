<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Registro - Academia de Idiomas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#485fc7',
                        primaryDark: '#3a51b3'
                    }
                }
            }
        }
    </script>
    <script>
        var myHeaders = new Headers();
        myHeaders.append("Content-Type", "application/json");

        function conectar(){
            document.querySelector(".error-message").style.display = "none";
            const btn = document.querySelector(".btn-primary");
            btn.classList.add("opacity-50", "cursor-not-allowed");
            
            var raw = JSON.stringify({
                "username": document.getElementById("username").value,
                "password": document.getElementById("password").value,
                "profile": document.getElementById("profile").value
            });

            var requestOptions = {
                method: 'POST',
                headers: myHeaders,
                body: raw
            };

            fetch("/api/usuarios/registro", requestOptions)
                .then(response => response.json())
                .then(result => {
                    btn.classList.remove("opacity-50", "cursor-not-allowed");
                    if (result.status=="OK"){
                        alert("Usuario registrado correctamente");
                        location.href="index.html";
                    } else {
                        document.querySelector(".error-message").style.display = "block";
                    }
                })
                .catch(error => {
                    btn.classList.remove("opacity-50", "cursor-not-allowed");
                    console.log('error', error);
                });
        }
        
        document.addEventListener('keypress', function(e) {
            if(e.key === 'Enter') {
                conectar();
            }
        });
    </script>
</head>
<body class="bg-gradient-to-br from-gray-100 to-gray-200 min-h-screen font-sans">
    <section class="bg-gradient-to-r from-primary to-purple-600 text-white py-12 px-8 rounded-b-3xl mb-12">
        <div class="container mx-auto text-center">
            <h1 class="text-3xl font-bold">
                <i class="fas fa-user-plus"></i> Registro de Usuario
            </h1>
            <p class="text-lg opacity-90 mt-2">Únete a nuestra academia de idiomas</p>
        </div>
    </section>

    <section class="container mx-auto px-4">
        <div class="max-w-lg mx-auto bg-white rounded-xl shadow-xl p-8 mb-12 transition-transform hover:-translate-y-1">
            <div class="error-message bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">
                <i class="fas fa-exclamation-triangle"></i> El usuario ya existe
            </div>
            
            <div class="mb-5">
                <label for="username" class="block font-semibold text-gray-700 mb-2">
                    <i class="fas fa-user"></i> Usuario
                </label>
                <input type="text" name="username" id="username" class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:border-primary focus:ring-4 focus:ring-primary/10 outline-none transition-all" placeholder="Elige un nombre de usuario" required>
            </div>
            
            <div class="mb-5">
                <label for="password" class="block font-semibold text-gray-700 mb-2">
                    <i class="fas fa-lock"></i> Contraseña
                </label>
                <input type="password" name="password" id="password" class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:border-primary focus:ring-4 focus:ring-primary/10 outline-none transition-all" placeholder="Crea una contraseña segura" required>
            </div>
            
            <div class="mb-6">
                <label for="profile" class="block font-semibold text-gray-700 mb-2">
                    <i class="fas fa-id-card"></i> Perfil
                </label>
                <input type="text" name="profile" id="profile" class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg bg-gray-100" value="alumno" disabled>
            </div>
            
            <div class="mb-4">
                <button type="button" onclick="conectar()" class="btn-primary w-full bg-primary hover:bg-primaryDark text-white font-bold py-3 px-6 rounded-lg transition-all transform hover:scale-105 shadow-lg">
                    <i class="fas fa-check"></i> Registrarse
                </button>
            </div>
            
            <div class="text-center">
                <a href="index.html" class="inline-flex items-center gap-2 text-primary hover:text-primaryDark font-semibold transition-colors">
                    <i class="fas fa-arrow-left"></i> Volver al inicio de sesión
                </a>
            </div>
        </div>
    </section>
</body>
</html>
